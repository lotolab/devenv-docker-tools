services:
  mysql:
    container_name: mysql5
    image: mysql:5.7.24
    restart: always
    volumes:
      - ${MNT_BASE_VOL}/mysql:/var/lib/mysql
      - ${MNT_BASE_VOL}/share:/root/share
    # command
    command:
      [
        '--character-set-server=utf8mb4',
        '--collation-server=utf8mb4_unicode_ci',
        '--skip-character-set-client-handshake',
      ]
    ports:
      - ${MYSQL_EXPOSE_PORT}:3306
    environment:
      - TZ=Asia/Shanghai
      - MYSQL_ROOT_PASSWORD=root123
      - MYSQL_USER=admin
      - MYSQL_PASSWORD=admin123
      - MYSQL_DATABASE=wgai-db
    logging:
      driver: 'json-file'
      options:
        'max-size': '1G'
    networks:
      - xy-network

  cache:
    container_name: cache
    image: redis:7-alpine
    restart: always
    privileged: true
    ports:
      - ${REDIS_EXPOSE_PORT}:6379
    command: redis-server --appendonly yes --save 300 10 --requirepass admin123
    volumes:
      - ${MNT_BASE_VOL}/redis:/data
      # - ./cache-conf/redis.conf:/etc/redis/redis.conf
    networks:
      - xy-network
      - xai-network

  postgres:
    image: postgres:15-alpine
    restart: always
    env_file:
      - ./.env
    environment:
      # default postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Root@1234}
      # POSTGRES_USER: xaify
      POSTGRES_DB: ${POSTGRES_DB:-xaidb}
      PGDATA: ${PGDATA:-/var/lib/postgresql/data/pgdata}
    command: >
      postgres -c 'max_connections=${POSTGRES_MAX_CONNECTIONS:-100}'
               -c 'shared_buffers=${POSTGRES_SHARED_BUFFERS:-128MB}'
               -c 'work_mem=${POSTGRES_WORK_MEM:-4MB}'
               -c 'maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-64MB}'
               -c 'effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-4096MB}'
    volumes:
      - ${PGDATA_HOST_VOLUME:-./volumes/postgredb/data}:/var/lib/postgresql/data
    ports:
      - "${EXPOSE_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB}"]
      interval: 1s
      timeout: 3s
      retries: 5
    networks:
      - xy-network
      - xai-network

networks:
  # create a internal network
  # xaify_proxy_network:
  #   driver: bridge
  #   internal: true
  xy-network:
    name: xy-network
    external: true
  xai-network:
    name: xai-network
    external: true
